name: CI

on:
  push:
    branches: [dev, release]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes older runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Content hashes of what each job verifies. A job whose inputs were
  # already verified successfully on the same OS skips its work and still
  # reports success, so required checks stay satisfied: documentation-only
  # changes and a pull request into `release` that matches a commit already
  # verified on `dev` finish in seconds.
  inputs:
    name: inputs
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.hash.outputs.rust }}
      npm: ${{ steps.hash.outputs.npm }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - id: hash
        name: Hash the inputs of each job
        run: |
          digest() {
            # An empty file list would make every run look verified.
            files=$(git ls-files -s -- "$@")
            test -n "$files" || { echo "no inputs matched: $*" >&2; exit 1; }
            printf '%s\n' "$files" | sha256sum | cut -c1-40
          }
          # Assignments, so a failing digest stops the step (bash -e).
          rust=$(digest crates src tests benches Cargo.toml Cargo.lock .cargo rust-toolchain rust-toolchain.toml scripts/tui-pty-smoke.py .github/workflows/ci.yml)
          npm=$(digest npm scripts/bench-report.mjs scripts/bench-report.test.mjs .github/workflows/ci.yml)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "npm=$npm" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Tests and the release build of each OS run as separate jobs, so the
  # slowest runners (Windows, macOS Intel) do them at the same time.
  test:
    name: fmt / clippy / test (${{ matrix.os }})
    needs: inputs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    env:
      VERIFIED_KEY: ci-verified-test-${{ matrix.os }}-${{ needs.inputs.outputs.rust }}
      # One runner covers formatting and the platform-independent 100k-event
      # checks. The benchmark workflow measures benchmark targets separately
      # in release builds.
      FULL_OS: ubuntu-latest
      # The default MSVC linker is slow to link the many test binaries.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v7
        with:
          # The build must never depend on private submodules.
          submodules: false
      - id: verified
        name: Look for an earlier successful run with the same inputs
        uses: actions/cache/restore@v6
        with:
          path: .ci-verified
          key: ${{ env.VERIFIED_KEY }}
          lookup-only: true
      - if: steps.verified.outputs.cache-hit == 'true'
        run: echo "Inputs ${{ needs.inputs.outputs.rust }} already passed on ${{ matrix.os }}; skipping."
      # Pinned so lint results are reproducible; upgraded deliberately.
      # Formatting and Clippy are platform-independent, so install their
      # components only on the full Linux runner. Other runners only need
      # the compiler for their platform-specific tests.
      - if: steps.verified.outputs.cache-hit != 'true' && matrix.os == env.FULL_OS
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - if: steps.verified.outputs.cache-hit != 'true' && matrix.os != env.FULL_OS
        uses: dtolnay/rust-toolchain@1.100.0
      - if: steps.verified.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          # Keep compiled dependencies even when a test fails.
          cache-on-failure: true
      - if: steps.verified.outputs.cache-hit != 'true' && matrix.os == env.FULL_OS
        run: cargo fmt --all -- --check
      # Clippy is covered once on FULL_OS; repeating it on every OS only
      # duplicates a platform-independent compile and lint pass.
      - if: steps.verified.outputs.cache-hit != 'true' && matrix.os == env.FULL_OS
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: steps.verified.outputs.cache-hit != 'true' && matrix.os == env.FULL_OS
        name: cargo test (workspace tests)
        # Bench targets run in bench.yml with release optimizations. Keeping
        # CI focused on test targets avoids rebuilding and executing the same
        # benchmark binaries here while preserving the full test suite.
        run: cargo test --workspace --lib --bins --tests --no-fail-fast
      - if: steps.verified.outputs.cache-hit != 'true' && matrix.os != env.FULL_OS
        name: cargo test (without the platform-independent 100k-event checks)
        run: >-
          cargo test --workspace --lib --bins --tests --no-fail-fast
          -- --skip first_render_and_interaction_latency_on_100k_events
      # Reached only when every step above passed.
      - name: Remember that these inputs passed
        if: steps.verified.outputs.cache-hit != 'true'
        shell: bash
        run: echo "${{ needs.inputs.outputs.rust }}" > .ci-verified
      - if: steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-verified
          key: ${{ env.VERIFIED_KEY }}

  # The release build of every platform is checked where it matters: pull
  # requests into `release` (required checks there) and pushes to it. Pushes
  # to `dev` run the tests only; the release workflow builds every target
  # again from the tag.
  build:
    name: release build (${{ matrix.os }})
    needs: inputs
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'release')
      || github.ref == 'refs/heads/release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    env:
      VERIFIED_KEY: ci-verified-build-${{ matrix.os }}-${{ needs.inputs.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The build must never depend on private submodules.
          submodules: false
      - id: verified
        name: Look for an earlier successful run with the same inputs
        uses: actions/cache/restore@v6
        with:
          path: .ci-verified
          key: ${{ env.VERIFIED_KEY }}
          lookup-only: true
      - if: steps.verified.outputs.cache-hit == 'true'
        run: echo "Inputs ${{ needs.inputs.outputs.rust }} already passed on ${{ matrix.os }}; skipping."
      # The same pinned toolchain as the tests.
      - if: steps.verified.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@1.100.0
      - if: steps.verified.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          # Keep compiled dependencies even when a later step fails.
          cache-on-failure: true
      - if: steps.verified.outputs.cache-hit != 'true'
        run: cargo build --workspace --release
      - name: Smoke test release binary
        if: steps.verified.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bin=target/release/ghusage
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" --help
      - name: Default cache location and paths with spaces
        if: steps.verified.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bin=target/release/ghusage
          [ -f "$bin.exe" ] && bin="$bin.exe"
          path=$(env -u GHUSAGE_DATA_DIR "$bin" cache status --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).path))')
          echo "default cache: $path"
          case "$RUNNER_OS" in
            macOS) expected="$HOME/Library/Application Support/dev.ghusage.ghusage/ghusage.db" ;;
            Linux) expected="${XDG_DATA_HOME:-$HOME/.local/share}/ghusage/ghusage.db" ;;
            Windows) expected="$(cygpath -w "$APPDATA")\\ghusage\\ghusage\\data\\ghusage.db" ;;
          esac
          test "$path" = "$expected" || { echo "expected $expected"; exit 1; }
          spaced="$RUNNER_TEMP/My Data/ghusage cache"
          "$bin" cache status --data-dir "$spaced"
          "$bin" overview --offline --user octocat --data-dir "$spaced" --format json > /dev/null
          test -f "$spaced/ghusage.db"
      - name: Terminal UI in a pseudo terminal
        if: steps.verified.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: python3 scripts/tui-pty-smoke.py target/release/ghusage "$RUNNER_TEMP/tui-data"
      # Reached only when every step above passed.
      - name: Remember that these inputs passed
        if: steps.verified.outputs.cache-hit != 'true'
        shell: bash
        run: echo "${{ needs.inputs.outputs.rust }}" > .ci-verified
      - if: steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-verified
          key: ${{ env.VERIFIED_KEY }}

  npm-launcher:
    name: npm launcher tests
    needs: inputs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    env:
      VERIFIED_KEY: ci-verified-npm-${{ matrix.os }}-${{ needs.inputs.outputs.npm }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - id: verified
        uses: actions/cache/restore@v6
        with:
          path: .ci-verified
          key: ${{ env.VERIFIED_KEY }}
          lookup-only: true
      - if: steps.verified.outputs.cache-hit == 'true'
        run: echo "Inputs ${{ needs.inputs.outputs.npm }} already passed on ${{ matrix.os }}; skipping."
      - if: steps.verified.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.verified.outputs.cache-hit != 'true'
        run: node --test "npm/test/*.test.mjs"
      - name: Benchmark report script tests
        if: steps.verified.outputs.cache-hit != 'true'
        run: node --test scripts/bench-report.test.mjs
      - name: Remember that these inputs passed
        if: steps.verified.outputs.cache-hit != 'true'
        shell: bash
        run: echo "${{ needs.inputs.outputs.npm }}" > .ci-verified
      - if: steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-verified
          key: ${{ env.VERIFIED_KEY }}

  # Always runs: new advisories appear without any change here.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: taiki-e/install-action@v2.90.8
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: taiki-e/install-action@v2.90.8
        with:
          tool: cargo-deny
      - run: cargo deny check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit documentation dependencies
        working-directory: docs
        run: |
          npm ci
          # The static-site toolchain is dev-only; see docs/SECURITY.md.
          npm audit --audit-level=high --omit=dev
      - name: Report documentation development dependency advisories
        working-directory: docs
        continue-on-error: true
        run: |
          # Keep visibility into the complete build toolchain while the
          # documented VitePress 1 exceptions remain accepted.
          npm audit --audit-level=high
      - name: Audit npm launcher dependencies
        working-directory: npm/ghusage
        run: npm audit --audit-level=high --package-lock=false

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-on-failure: true
      - run: cargo check --workspace --locked
