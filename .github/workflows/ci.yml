name: CI

on:
  push:
    branches: [dev, release]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The build must never depend on private submodules.
          submodules: false
      # Pinned so lint results are reproducible; upgraded deliberately.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets --no-fail-fast
      - run: cargo build --workspace --release
      - name: Smoke test release binary
        shell: bash
        run: |
          bin=target/release/ghusage
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" --help
      - name: Default cache location and paths with spaces
        shell: bash
        run: |
          bin=target/release/ghusage
          [ -f "$bin.exe" ] && bin="$bin.exe"
          path=$(env -u GHUSAGE_DATA_DIR "$bin" cache status --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).path))')
          echo "default cache: $path"
          case "$RUNNER_OS" in
            macOS) expected="$HOME/Library/Application Support/dev.ghusage.ghusage/ghusage.db" ;;
            Linux) expected="${XDG_DATA_HOME:-$HOME/.local/share}/ghusage/ghusage.db" ;;
            Windows) expected="$(cygpath -w "$APPDATA")\\ghusage\\ghusage\\data\\ghusage.db" ;;
          esac
          test "$path" = "$expected" || { echo "expected $expected"; exit 1; }
          spaced="$RUNNER_TEMP/My Data/ghusage cache"
          "$bin" cache status --data-dir "$spaced"
          "$bin" overview --offline --user octocat --data-dir "$spaced" --format json > /dev/null
          test -f "$spaced/ghusage.db"
      - name: Terminal UI in a pseudo terminal
        if: runner.os != 'Windows'
        run: python3 scripts/tui-pty-smoke.py target/release/ghusage "$RUNNER_TEMP/tui-data"

  npm-launcher:
    name: npm launcher tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "npm/test/*.test.mjs"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
