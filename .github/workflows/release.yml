name: Release

# Builds release binaries for every supported platform, assembles the npm
# packages, installs them on each platform and (optionally) publishes them.
#
# - Pushing a tag `vX.Y.Z` on a commit of the `release` branch runs
#   everything and publishes. Tags on other commits are refused.
# - Running the workflow manually builds and verifies; it publishes only
#   when the `publish` input is checked and the run is on `release`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  source:
    name: check the release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Releases come only from the release branch
        if: github.ref_type == 'tag' || inputs.publish
        run: |
          git fetch --no-tags origin release
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "$GITHUB_SHA is not on the release branch; merge it into release first." >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, bin: ghusage }
          - { os: macos-15-intel, target: x86_64-apple-darwin, bin: ghusage }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, bin: ghusage }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, bin: ghusage }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: ghusage.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, bin: ghusage.exe }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test the binary on this platform
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          "$bin" --version
          "$bin" --help > /dev/null
          data="$(mktemp -d)"
          GHUSAGE_DATA_DIR="$data" "$bin" cache status
          set +e
          "$bin" --format xml > /dev/null 2>&1
          code=$?
          set -e
          test "$code" = 2
      - name: Show binary details
        if: runner.os == 'Linux'
        run: file "target/${{ matrix.target }}/release/${{ matrix.bin }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  package:
    name: assemble npm packages
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Arrange binaries by target
        run: |
          mkdir -p binaries
          for d in artifacts/bin-*; do
            t="${d#artifacts/bin-}"
            mkdir -p "binaries/$t"
            cp "$d"/* "binaries/$t/"
          done
          ls -R binaries
      - id: version
        name: Determine version
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build packages
        run: |
          node npm/scripts/build-packages.mjs --version "${{ steps.version.outputs.version }}" \
            --binaries binaries --out dist \
            --only @ghusage/ghusage-darwin-arm64 --only @ghusage/ghusage-darwin-x64 \
            --only @ghusage/ghusage-linux-arm64 --only @ghusage/ghusage-linux-x64 \
            --only @ghusage/ghusage-win32-arm64 --only @ghusage/ghusage-win32-x64
      - name: Pack
        run: |
          mkdir -p tgz
          for d in dist/*/; do (cd "$d" && npm pack --pack-destination ../../tgz); done
          ls -l tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: tgz/*.tgz
          if-no-files-found: error

  verify:
    name: npm install (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # npm pack names @ghusage/ghusage-<platform> as ghusage-ghusage-<platform>-<version>.tgz
          - { os: macos-15, pkg: ghusage-ghusage-darwin-arm64 }
          - { os: macos-15-intel, pkg: ghusage-ghusage-darwin-x64 }
          - { os: ubuntu-latest, pkg: ghusage-ghusage-linux-x64 }
          - { os: ubuntu-24.04-arm, pkg: ghusage-ghusage-linux-arm64 }
          - { os: windows-latest, pkg: ghusage-ghusage-win32-x64 }
          - { os: windows-11-arm, pkg: ghusage-ghusage-win32-arm64 }
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: tgz
      - name: Install from the packed tarballs and run
        shell: bash
        run: |
          v="${{ needs.package.outputs.version }}"
          tgz="$(pwd)/tgz"
          mkdir proj && cd proj
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tgz/${{ matrix.pkg }}-$v.tgz" "$tgz/ghusage-$v.tgz"
          npx --no-install ghusage --version
          npx --no-install ghusage --help > /dev/null
          data="$(mktemp -d)"
          GHUSAGE_DATA_DIR="$data" npx --no-install ghusage cache status
          set +e
          npx --no-install ghusage --format xml > /dev/null 2>&1
          code=$?
          set -e
          test "$code" = 2

  publish:
    name: publish to npm
    needs: [package, verify]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    # npm trusted publishing: each package on npmjs.com trusts this
    # repository, this workflow file and this environment. Configure required
    # reviewers for the environment so every publish is approved.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1 && npm --version
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: tgz
      - name: Publish platform packages, then the main package
        shell: bash
        run: |
          v="${{ needs.package.outputs.version }}"
          field() {
            tar -xOzf "$1" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[process.argv[1]]))' "$2"
          }
          if [ "$(field "tgz/ghusage-$v.tgz" license)" = "UNLICENSED" ]; then
            echo "The package license is not set; refusing to publish." >&2
            exit 1
          fi
          publish() {
            local f="$1" name
            name=$(field "$f" name)
            # Re-running a release must not fail on versions already published.
            if npm view "$name@$v" version > /dev/null 2>&1; then
              echo "$name@$v is already published; skipping"
              return
            fi
            npm publish "$f" --access public
          }
          for f in tgz/*.tgz; do
            case "$f" in "tgz/ghusage-$v.tgz") continue ;; esac
            publish "$f"
          done
          publish "tgz/ghusage-$v.tgz"
