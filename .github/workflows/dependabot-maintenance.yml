name: Dependabot maintenance

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: merge compatible Dependabot updates
    runs-on: ubuntu-latest
    steps:
      - name: Select and maintain Dependabot pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Work from the oldest update first so grouped updates are handled
          # predictably. Only one merge is attempted per run; the next run
          # re-evaluates the remaining PRs against the new dependency graph.
          prs=$(gh pr list --repo "$GH_REPO" --state open --base dev --limit 100 \
            --json number,title,author,updatedAt \
            --jq '[.[] | select(.author.login == "dependabot[bot]")] | sort_by(.updatedAt)')

          merged=false
          while IFS= read -r pr; do
            number=$(jq -r '.number' <<< "$pr")
            title=$(jq -r '.title' <<< "$pr")
            details=$(gh pr view "$number" --repo "$GH_REPO" \
              --json isDraft,mergeable,mergeStateStatus,statusCheckRollup,labels,body)

            is_draft=$(jq -r '.isDraft' <<< "$details")
            mergeable=$(jq -r '.mergeable' <<< "$details")
            merge_state=$(jq -r '.mergeStateStatus' <<< "$details")
            checks=$(jq -c '.statusCheckRollup // []' <<< "$details")

            # Dependabot does not expose a stable update-type field through
            # `gh pr view` for every ecosystem. Reject an update unless every
            # version transition in the PR body is a detectable minor/patch
            # update. This fails closed for grouped or unfamiliar formats.
            has_major=$(jq -r '.labels[]?.name' <<< "$details" | \
              grep -Fxq 'semver-major' && echo true || echo false)
            if [[ "$has_major" == "false" ]]; then
              has_major=$(jq -r '.body // ""' <<< "$details" | \
                node -e '
                  let s = "";
                  process.stdin.on("data", chunk => { s += chunk; });
                  process.stdin.on("end", () => {
                    const transitions = [...s.matchAll(/from\\s+v?(\\d+)(?:\\.\\d+){0,2}[^\\n]*?to\\s+v?(\\d+)(?:\\.\\d+){0,2}/gi)];
                    if (transitions.length === 0 || transitions.some(match => Number(match[2]) > Number(match[1]))) {
                      process.stdout.write("true");
                    } else {
                      process.stdout.write("false");
                    }
                  });
                ')
            fi

            if [[ "$has_major" == "true" ]]; then
              echo "Leaving #$number ($title) open: major update requires review"
              continue
            fi

            if [[ "$is_draft" == "true" || "$mergeable" == "UNKNOWN" ]]; then
              echo "Skipping #$number ($title): draft or mergeability is not settled"
              continue
            fi

            has_pending=$(jq -r '[.[] | select((.status // "") != "COMPLETED" and (.state // "") != "SUCCESS")] | length > 0' <<< "$checks")
            has_failure=$(jq -r '[.[] | select(
              ((.conclusion // "") | IN("FAILURE", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED")) or
              ((.state // "") | IN("FAILURE", "ERROR"))
            )] | length > 0' <<< "$checks")
            all_success=$(jq -r 'length > 0 and all(.[]; 
              ((.conclusion // "") | IN("SUCCESS", "NEUTRAL", "SKIPPED")) or
              ((.state // "") == "SUCCESS")
            )' <<< "$checks")

            if [[ "$merge_state" == "CONFLICTING" || "$has_failure" == "true" ]]; then
              echo "Leaving #$number ($title) open: merge state=$merge_state, failed checks=$has_failure"
              continue
            fi

            if [[ "$merge_state" == "CLEAN" && "$all_success" == "true" && "$has_pending" == "false" ]]; then
              gh pr merge "$number" --repo "$GH_REPO" --squash --delete-branch
              echo "Merged #$number ($title)"
              # A merge performed with GITHUB_TOKEN does not cause a normal
              # push-triggered workflow. Dispatch CI explicitly for dev so
              # the merged dependency graph is verified as well.
              gh workflow run ci.yml --repo "$GH_REPO" --ref dev
              echo "Dispatched CI for dev after merging #$number"
              merged=true
              break
            fi

            echo "Leaving #$number ($title) open: checks or mergeability are not ready"
          done < <(jq -c '.[]' <<< "$prs")

          if [[ "$merged" == "false" ]]; then
            echo "No compatible Dependabot pull request was merged"
          fi
