name: Pull request guidance

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

# This workflow uses its trusted default-branch script and the GitHub API. Never
# check out or execute pull request content in this privileged event.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-guidance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    name: Recommend pull request workflow
    runs-on: ubuntu-latest
    steps:
      # The release branch may predate this script. Always use the trusted
      # repository default branch; never fetch or execute PR code.
      - name: Checkout trusted guidance script
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/pr-guidance.cjs
          sparse-checkout-cone-mode: false
      - name: Update guidance comment
        uses: actions/github-script@v8
        with:
          script: |
            const { runGuidance } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-guidance.cjs`);
            await runGuidance({ github, context });
