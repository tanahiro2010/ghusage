[package]
name = "ghusage-github"
description = "GitHub API client and data fetching for ghusage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
jiff = { version = "1.0.2", features = ["serde"] }
futures = "0.3.34"
ghusage-core = { version = "0.2.0", path = "../ghusage-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "test-util", "net", "io-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
wiremock = "0.6.5"
