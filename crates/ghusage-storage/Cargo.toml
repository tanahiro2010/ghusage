[package]
name = "ghusage-storage"
description = "SQLite cache and persistence layer for ghusage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
jiff = { version = "1.0.2", features = ["serde"] }
fs4 = "1.1.0"
ghusage-core = { version = "0.2.0", path = "../ghusage-core" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
