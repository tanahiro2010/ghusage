[package]
name = "ghusage-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
jiff = { version = "1.0.2", features = ["serde"] }
csv = "1.4.0"
directories = "6.0.0"
futures = "0.3.34"
ghusage-core = { version = "0.1.6", path = "../ghusage-core" }
ghusage-github = { version = "0.1.6", path = "../ghusage-github" }
ghusage-storage = { version = "0.1.6", path = "../ghusage-storage" }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
ghusage-github = { version = "0.1.6", path = "../ghusage-github" }
proptest = "1.11.0"
tempfile = "3.27.0"
wiremock = "0.6.5"
