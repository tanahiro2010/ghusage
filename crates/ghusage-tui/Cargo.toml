[package]
name = "ghusage-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
ghusage-app = { version = "0.1.3", path = "../ghusage-app" }
ghusage-core = { version = "0.1.3", path = "../ghusage-core" }
ghusage-github = { version = "0.1.3", path = "../ghusage-github" }
ratatui = "0.30"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
unicode-width = "0.2.3"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

[dev-dependencies]
ghusage-storage = { version = "0.1.3", path = "../ghusage-storage" }
tempfile = "3.27.0"
