[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/tanahiro2010/ghusage"
license = "Apache-2.0"

[package]
name = "ghusage"
description = "Know what you actually did on GitHub: commits, pull requests, reviews and the activity inside pull requests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "ghusage"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.9", features = ["derive", "env"] }
ghusage-app = { version = "0.1.3", path = "crates/ghusage-app" }
ghusage-core = { version = "0.1.3", path = "crates/ghusage-core" }
ghusage-github = { version = "0.1.3", path = "crates/ghusage-github" }
ghusage-storage = { version = "0.1.3", path = "crates/ghusage-storage" }
ghusage-tui = { version = "0.1.3", path = "crates/ghusage-tui" }
ratatui = "0.30"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 4

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.8.2"
csv = "1.4.0"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

[[bench]]
name = "aggregation"
harness = false

[[bench]]
name = "latency"
harness = false
